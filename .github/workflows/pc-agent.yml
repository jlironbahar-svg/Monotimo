# Runs the PC agent test-suite on Windows, macOS and Linux.
name: PC agent tests

on:
  push:
    paths:
      - 'pc-agent/**'
      - 'shared/**'
      - '.github/workflows/pc-agent.yml'
  pull_request:
    paths:
      - 'pc-agent/**'
      - 'shared/**'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pc-agent
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pc-agent/requirements*.txt

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q --durations=5
