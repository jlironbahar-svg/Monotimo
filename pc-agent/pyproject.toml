[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-friend"
version = "1.0.0"
description = "Desktop Friend PC host agent: QR pairing, blue AI cursor overlay, screen vision and automation, Groq + ElevenLabs brain."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9,<4",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "qrcode>=7.4,<9",
  "Pillow>=10.0",
  "mss>=9.0",
  "pyautogui>=0.9.54",
  "pyperclip>=1.8",
  "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.0"]

[project.scripts]
desktop-friend = "desktop_friend.__main__:main"

[tool.setuptools]
packages = ["desktop_friend", "desktop_friend.gui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
